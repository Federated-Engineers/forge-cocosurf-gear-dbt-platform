name: 'cocosurf'
version: '1.0.0'
config-version: 2

profile: 'cocosurf'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  cocosurf:
    staging:
      +schema: STAGING
      +materialized: view

    analytics:
      +schema: ANALYTICS
      +materialized: table