version: 2

models:
  - name: dim_customer
    description: "Customer dimension containing customer attributes and segmentation."
    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension derived from the available product identifiers."
    columns:
      - name: product_id
        description: "Unique identifier for the product."
        data_tests:
          - unique
          - not_null

  - name: dim_sku
    description: "SKU dimension containing product, pricing, weight, and active-status attributes."
    columns:
      - name: sku_id
        description: "Unique identifier for the SKU."
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Order-level fact table with source order totals and calculated revenue."
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: calculated_revenue
        description: "Revenue calculated from net item amounts plus transaction tax."

  - name: fct_order_items
    description: "Order-item fact table preserving transaction-level selling prices and discounts."
    columns:
      - name: order_item_id
        description: "Unique identifier for the order item."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Order containing the item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: sku_id
        description: "SKU associated with the order item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sku')
                field: sku_id

      - name: net_item_amount
        description: "Item sales amount after applying the recorded discount."

  - name: fct_inventory
    description: "Warehouse-level inventory fact table with available-to-promise stock."
    columns:
      - name: inventory_id
        description: "Unique identifier for the inventory record."
        data_tests:
          - unique
          - not_null

      - name: sku_id
        description: "SKU associated with the inventory record."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sku')
                field: sku_id

      - name: available_to_promise
        description: "Quantity available for sale after subtracting reserved inventory from quantity on hand."